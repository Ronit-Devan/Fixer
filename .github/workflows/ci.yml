name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/

      - name: Type check with mypy
        run: uv run mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: uv run pytest -v

  remediation:
    name: remediation (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/remediation
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run --with mypy mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: uv run pytest -v

  # agent + web-api are not part of the client-SFF change; run their test suites
  # for regression coverage (web-api consumes the monitor types this work
  # extended) but do NOT gate on their pre-existing lint state.
  agent:
    name: agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -v

  web-api:
    name: web-api (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web/api
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Run tests
        run: uv run pytest -v

  monitor:
    name: monitor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/monitor
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # --all-extras pulls the sibling et-remediation (path source) + gpu extra;
      # --dev pulls pytest, httpx, ruff — so the remediation-wiring and HTTP
      # server tests collect without any ad-hoc flags.
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type check with mypy
        run: uv run --with mypy mypy src/ --ignore-missing-imports || true

      - name: Run tests
        run: uv run pytest -v
